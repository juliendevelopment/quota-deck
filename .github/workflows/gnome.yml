name: GNOME CI
on:
  push:
    branches: [main, feat/gnome-extension]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    name: GNOME / Fedora ${{ matrix.fedora }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fedora: ['43', '44']
    container:
      image: fedora:${{ matrix.fedora }}
    defaults:
      run:
        working-directory: clients/gnome-extension
    steps:
      - name: Install native test tooling without weak dependencies
        working-directory: /
        run: >-
          dnf -y --setopt=install_weak_deps=False install
          git nodejs npm gjs gnome-shell gnome-keyring libsecret libadwaita python3
          dbus-daemon xorg-x11-server-Xvfb xorg-x11-xauth mesa-dri-drivers mesa-libEGL dejavu-sans-fonts
      - uses: actions/checkout@v4
      - name: Create an unprivileged account for GNOME and keyring tests
        run: |
          useradd -m -u 1000 quotadeck 2>/dev/null || true
      - name: Start an isolated container system bus for headless Shell
        run: |
          mkdir -p /run/dbus
          dbus-daemon --system --fork
          # This container has no logind. An empty package-created seat directory
          # would make GNOME 49 select systemd instead of its official dummy manager.
          if [ -d /run/systemd/seats ]; then rmdir /run/systemd/seats; fi
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts
      - name: Test providers, privacy, lifecycle, GJS, keyring, GTK and real headless Shell; package
        env:
          TMPDIR: /tmp/quotadeck-scratchpad
        run: |
          mkdir -p /tmp/quotadeck-scratchpad
          chown -R quotadeck:quotadeck .
          chown quotadeck:quotadeck /tmp/quotadeck-scratchpad
          runuser -u quotadeck -- env TMPDIR=/tmp/quotadeck-scratchpad python3 scripts/verify.py --shell
      - name: Installable GNOME archive and checksum
        uses: actions/upload-artifact@v4
        with:
          name: QuotaDeck-GNOME-fedora${{ matrix.fedora }}
          path: clients/gnome-extension/dist/
          if-no-files-found: error
          retention-days: 30
      - name: Native verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuotaDeck-GNOME-reports-fedora${{ matrix.fedora }}
          path: clients/gnome-extension/build/reports/
          retention-days: 30
