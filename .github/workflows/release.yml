name: Signed Android Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Version from validated semver tag
        shell: python
        run: |
          import os, re
          version = os.environ['GITHUB_REF_NAME']
          match = re.fullmatch(r'v(\d+)\.(\d+)\.(\d+)', version)
          if not match:
              raise SystemExit('Tag attendu : vMAJOR.MINOR.PATCH')
          major, minor, patch = map(int, match.groups())
          if minor > 99 or patch > 99:
              raise SystemExit('MINOR et PATCH doivent être inférieurs à 100')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'VERSION_NAME={version[1:]}\nVERSION_CODE={major*10000+minor*100+patch}\n')
      - name: Decode dedicated release key
        shell: python
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          import base64, os
          if not os.environ['KEYSTORE']:
              raise SystemExit('Clé absente : refus de publier un APK non signé')
          path = os.path.join(os.environ['RUNNER_TEMP'], 'quota-deck-release.jks')
          with open(path, 'wb') as f:
              f.write(base64.b64decode(os.environ['KEYSTORE'], validate=True))
          os.chmod(path, 0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'SIGNING_STORE_FILE={path}\n')
      - name: Verify and build signed APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_STORE_PASSWORD" && test -n "$SIGNING_KEY_ALIAS" && test -n "$SIGNING_KEY_PASSWORD"
          ./gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon --console=plain
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "QuotaDeck-${GITHUB_REF_NAME}.apk"
          sha256sum "QuotaDeck-${GITHUB_REF_NAME}.apk" > SHA256SUMS.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "QuotaDeck-${GITHUB_REF_NAME}.apk" SHA256SUMS.txt --verify-tag --prerelease --title "QuotaDeck ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
      - name: Remove decoded signing key
        if: always()
        shell: python
        run: |
          import os
          path = os.path.join(os.environ['RUNNER_TEMP'], 'quota-deck-release.jks')
          if os.path.exists(path): os.remove(path)
